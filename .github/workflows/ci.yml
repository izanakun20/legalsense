name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run ESLint
      run: npm run lint
      
    - name: Run Typecheck
      run: npm run typecheck
      
    - name: Run Tests with Coverage
      run: npm run coverage
      
    - name: Build Application
      run: npm run build
      env:
        GEMINI_API_KEY: AIzaDummyKey_1234567890abcdefghijklmnopqrst
        
    - name: Check for Leaked Keys in Build Output
      run: |
        if grep -rq "AIza" .next/static; then
          echo "ERROR: Dummy GEMINI_API_KEY was leaked into the client bundle (.next/static)."
          exit 1
        else
          echo "Success: No keys leaked into client bundle."
        fi
        
    - name: Run Security Audit
      run: npm audit --omit=dev --audit-level=high
