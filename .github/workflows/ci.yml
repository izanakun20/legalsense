name: CI

on:
  push:
    branches: [ "main", "release-1" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.9.0'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Lint
      run: npm run lint -- --max-warnings 0
      
    - name: Typecheck
      run: npm run typecheck
      
    - name: Test and Coverage
      run: npm run coverage
      
    - name: Build
      run: npm run build
      env:
        GEMINI_API_KEY: AIzaSyDummyKeyForTestingAndSecurityCheck
        
    - name: Security Check - No API Key Leakage
      run: |
        if grep -rq "AIzaSyDummyKeyForTestingAndSecurityCheck" .next/static; then
          echo "FAIL: Dummy GEMINI_API_KEY leaked into client bundle (.next/static)!"
          exit 1
        else
          echo "PASS: No API key leakage detected."
        fi
        
    - name: NPM Audit
      run: npm audit --omit=dev --audit-level=high
